services:

  # 4. Kong Data Plane
  kong-dp:
    container_name: kong-dp
    hostname: kong-dp
    image: kong/kong-gateway:3.13
    env_file:
      - .env
      - .env-konnect-cluster
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CERT: /etc/kong/certs/tls.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/certs/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ROUTER_FLAVOR: expressions
      KONG_LOG_LEVEL: debug
    volumes:
      - ./certs:/etc/kong/certs:ro
    ports:
      - "8000:8000"
      - "8443:8443"
    networks:
      - internal
      - external
    restart: unless-stopped

  ollama:
    container_name: ollama
    hostname: ollama
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - internal
      - external
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  internal:
    name: intra-net
    driver: bridge
    internal: true
  external:
    name: hands-net
    driver: bridge
