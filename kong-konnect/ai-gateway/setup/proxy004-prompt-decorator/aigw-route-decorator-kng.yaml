_format_version: "3.0"
# =============================================================================
# Kong AI Gateway - Route Definition for Prompt Decorator Demo
# Demo: ai-prompt-decorator — force Kansai dialect via hidden system prompt
# Depends on: ollama-service (aigw-service-kng.yaml)
# =============================================================================
routes:
- name: ollama-route-decorator
  service:
    name: ollama-service
  paths:
  - /ai/decorator/chat
  protocols:
  - http
  - https
  strip_path: true
  path_handling: v0
  https_redirect_status_code: 426
  regex_priority: 0
  request_buffering: true
  response_buffering: true
  preserve_host: false
