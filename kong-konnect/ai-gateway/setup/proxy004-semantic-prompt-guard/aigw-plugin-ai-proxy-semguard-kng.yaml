_format_version: "3.0"
# =============================================================================
# Kong AI Gateway - AI Proxy Plugin
# Route-scoped: applies to ollama-route-semguard only
# Single target: Ollama / qwen2.5:1.5b
# =============================================================================
plugins:
- name: ai-proxy
  enabled: true
  route: ollama-route-semguard
  protocols:
  - grpc
  - grpcs
  - http
  - https
  - ws
  - wss
  config:
    route_type: llm/v1/chat
    llm_format: openai
    model_name_header: true
    response_streaming: allow
    genai_category: text/generation
    max_request_body_size: 8192
    auth:
      allow_override: false
    model:
      provider: ollama
      name: qwen2.5:1.5b
      options:
        upstream_url: http://ollama:11434/api/chat
    logging:
      log_payloads: true
      log_statistics: true

- name: file-log
  enabled: true
  route: ollama-route-semguard
  config:
    path: /dev/stdout
    reopen: false
