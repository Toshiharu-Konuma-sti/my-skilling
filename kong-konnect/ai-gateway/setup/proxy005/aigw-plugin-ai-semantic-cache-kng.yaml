_format_version: "3.0"
# =============================================================================
# Kong AI Gateway - AI Semantic Cache Plugin
# Route-scoped: applies to ollama-route-semcache only
# VectorDB: Redis Stack (VSS) — vector similarity search
# Embeddings: Ollama / nomic-embed-text (768 dimensions)
#
# Demo flow:
#   1st request  → X-Cache-Status: Miss  → Ollama が応答 (数秒)
#   同じ質問     → X-Cache-Status: Hit   → 即座に返却
#   表現が違う類似質問 → X-Cache-Status: Hit   → 即座に返却 ← ここが見せ場
#
# 事前準備:
#   - Redis Stack コンテナ起動 (docker-compose-ollama.yml に定義済み)
#   - nomic-embed-text モデルの pull (ollama-init コンテナで自動実行)
# =============================================================================
plugins:
- name: ai-semantic-cache
  enabled: true
  route: ollama-route-semcache
  protocols:
  - grpc
  - grpcs
  - http
  - https
  config:
    embeddings:
      model:
        provider: ollama
        name: nomic-embed-text
        options:
          upstream_url: http://ollama:11434
    vectordb:
      strategy: redis
      redis:
        host: redis-stack
        port: 6379
      dimensions: 768
      distance_metric: cosine
      threshold: 0.5
    cache_ttl: 300
    message_countback: 1
