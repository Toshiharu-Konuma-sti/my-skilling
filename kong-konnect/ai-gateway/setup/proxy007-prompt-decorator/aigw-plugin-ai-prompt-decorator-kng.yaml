_format_version: "3.0"
# =============================================================================
# Kong AI Gateway - AI Prompt Decorator Plugin
# Route-scoped: applies to ollama-route-decorator only
# prepend: system prompt forcing Japanese response (invisible to the client)
# append:  footer to confirm the decorator is working
# =============================================================================
plugins:
- name: ai-prompt-decorator
  enabled: true
  route: ollama-route-decorator
  protocols:
  - grpc
  - grpcs
  - http
  - https
  config:
    prompts:
      prepend:
      - role: system
        content: "必ず日本語で回答してください。"
      append:
      - role: user
        content: "回答の後に次の行を必ず追加してください: --- Powered by Kong AI Gateway ---"
