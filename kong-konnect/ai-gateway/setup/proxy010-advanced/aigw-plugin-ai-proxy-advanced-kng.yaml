_format_version: "3.0"
# =============================================================================
# Kong AI Gateway - AI Proxy Advanced Plugin
# Route-scoped: applies to ollama-route-advanced only
# Balancing: round-robin — Kong selects qwen2.5:1.5b or tinyllama automatically
# Client: "model" field value is ignored (overwritten by Kong)
# =============================================================================
plugins:
- name: ai-proxy-advanced
  enabled: true
  route: ollama-route-advanced
  protocols:
  - grpc
  - grpcs
  - http
  - https
  - ws
  - wss
  config:
    balancer:
      algorithm: round-robin
      read_timeout: 300000
      write_timeout: 300000
      connect_timeout: 60000
    targets:
    - model:
        provider: ollama
        name: qwen2.5:1.5b
        options:
          upstream_url: http://ollama:11434/api/chat
      route_type: llm/v1/chat
      weight: 100
      auth:
        allow_override: false
      logging:
        log_payloads: true
        log_statistics: true
    - model:
        provider: ollama
        name: tinyllama
        options:
          upstream_url: http://ollama:11434/api/chat
      route_type: llm/v1/chat
      weight: 100
      auth:
        allow_override: false
      logging:
        log_payloads: true
        log_statistics: true
    llm_format: openai
    genai_category: text/generation
    model_name_header: true
    response_streaming: allow
    max_request_body_size: 8192

- name: file-log
  enabled: true
  route: ollama-route-advanced
  config:
    path: /dev/stdout
    reopen: false