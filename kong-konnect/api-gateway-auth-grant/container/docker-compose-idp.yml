services:

  # Kong Data Plane
  kong-dp:
    env_file:
      - .env
      - .env-konnect-cluster

  # Keycloak (IdP)
  keycloak:
    container_name: keycloak
    hostname: keycloak
    image: quay.io/keycloak/keycloak:26.5.6
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - internal
      - external
    restart: unless-stopped

  # Redis
  redis:
    container_name: redis
    hostname: redis
    image: redis:8.6.2-alpine
    networks:
      - internal
    restart: unless-stopped

  # Redis Insight (Web UI)
  redis-insight:
    container_name: redis-insight
    hostname: redis-insight
    image: redis/redisinsight:3.2.0
    ports:
      - "8001:5540"
    networks:
      - internal
      - external
    restart: unless-stopped
