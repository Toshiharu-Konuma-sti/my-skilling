openapi: 3.1.0
info:
  title: Yahoo! Topics RSS API - IT
  version: 1.0.0
  description: |
    ルートからサービスへ Route Transformer plugin を使って URL をトランスフォームする検証用です。
    URL 例：
    - curl -i http://localhost:8000/handson/no-auth/v1/transform/route-transformer/rss/topics/it.xml
    - curl -i http://localhost:8000/handson/no-auth/v1/transform/route-transformer/rss/categories/local.xml
  contact:
    name: API管理者
    email: admin@example.com
servers:
  - url: http://localhost:8000
x-kong-name: no-auth-transform-route-transformer
x-kong-service-defaults:
  protocol: https
  host: news.yahoo.co.jp
  port: 443
paths:
  /handson/no-auth/v1/transform/route-transformer/{p1}/{p2}/{p3}:
    get:
      parameters:
        - name: p1
          in: path
          required: true
          schema:
            type: string
        - name: p2
          in: path
          required: true
          schema:
            type: string
        - name: p3
          in: path
          required: true
          schema:
            type: string
      x-kong-plugin-route-transformer-advanced:
        name: route-transformer-advanced
        enabled: true
        config:
          path: /$(uri_captures["p1"])/$(uri_captures["p2"])/$(uri_captures["p3"])
      responses:
        '200':
          description: OK
