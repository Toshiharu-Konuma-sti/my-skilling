# ===========================================================================
# GitLab CI/CD パイプライン定義 (java-gradle)
#
# Trigger : feature/sample → main への MR がマージされたとき
#           （main ブランチへの push イベントで検知）
#
# Stages  :
#   1. build   - Nexus プロキシリポジトリ経由で依存関係を取得しビルド
#   2. publish - ビルド成果物を Nexus ホステッドリポジトリへアップロード
#
# Note    : CI ジョブは hands-net ネットワーク上で実行される。
#           Nexus ・ GitLab はどちらも hands-net に所属しているためコンテナ名で到達可能。
#           インターネットにも直接アクセス可能なので ./gradlew をそのまま使用できる。
#
# Variables (GitLab グループ CI/CD Variables から自動継承):
#   NEXUS_URL  - Nexus コンテナ内部 URL (例: http://nexus:8081)
#   NEXUS_USER - Nexus ユーザー名
#   NEXUS_PASS - Nexus パスワード (masked)
# ===========================================================================

# main ブランチへの push 時のみパイプラインを実行
# （MR マージ = main への push であるため、実質 MR マージ時のみ起動）
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - build
  - publish

variables:
  # Gradle デーモン無効（CI 環境では不要）
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Gradle キャッシュをプロジェクトディレクトリ配下に配置（GitLab キャッシュ対象にするため）
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# ---------------------------------------------------------------------------
# Stage 1: build
#   Nexus maven-public（プロキシグループ）経由で依存関係を取得しビルド
# ---------------------------------------------------------------------------
build:
  stage: build
  image: eclipse-temurin:21-jdk
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew clean build
        -P repoManagerUrl="${NEXUS_URL}"
        -P repoManagerUsername="${NEXUS_USER}"
        -P repoManagerPassword="${NEXUS_PASS}"
  artifacts:
    name: "${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/libs/*.jar
    expire_in: 7 days
  cache:
    key: "${CI_PROJECT_ID}-gradle"
    paths:
      - .gradle/wrapper/dists/
      - .gradle/caches/

# ---------------------------------------------------------------------------
# Stage 2: publish
#   ビルド成果物を Nexus maven-releases（ホステッド）へアップロード
#   バージョンが SNAPSHOT で終わる場合は maven-snapshots へ自動振り分け
#   （build.gradle の publishing.repositories.maven.url 参照）
# ---------------------------------------------------------------------------
publish:
  stage: publish
  image: eclipse-temurin:21-jdk
  before_script:
    - chmod +x ./gradlew
  script:
    - ./gradlew publish
        -PrepoManagerUrl="${NEXUS_URL}"
        -PrepoManagerUsername="${NEXUS_USER}"
        -PrepoManagerPassword="${NEXUS_PASS}"
  needs:
    - job: build
  cache:
    key: "${CI_PROJECT_ID}-gradle"
    paths:
      - .gradle/wrapper/dists/
      - .gradle/caches/
