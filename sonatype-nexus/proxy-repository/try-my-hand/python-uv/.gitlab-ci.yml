# ===========================================================================
# GitLab CI/CD パイプライン定義 (python-uv)
#
# Trigger : feature/sample → main への MR がマージされたとき
#           （main ブランチへの push イベントで検知）
#
# Stages  :
#   1. build   - Nexus PyPI プロキシ経由で依存関係を取得しアプリを実行確認
#   2. publish - ビルド成果物を Nexus PyPI ホステッドリポジトリへアップロード
#
# Note    : uv は python:3-slim イメージに pip でインストールする。
#           UV_DEFAULT_INDEX 環境変数で uv.toml の [[index]] 設定を上書きし
#           コンテナ内部の Nexus URL を向かせる。
#
# Variables (GitLab グループ CI/CD Variables から自動継承):
#   NEXUS_URL  - Nexus コンテナ内部 URL (例: http://nexus:8081)
#   NEXUS_USER - Nexus ユーザー名
#   NEXUS_PASS - Nexus パスワード (masked)
# ===========================================================================

# main ブランチへの push 時のみパイプラインを実行
# （MR マージ = main への push であるため、実質 MR マージ時のみ起動）
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - build
  - publish

variables:
  # uv キャッシュをプロジェクトディレクトリ配下に配置（GitLab キャッシュ対象にするため）
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

# uv のインストールと Nexus インデックス URL の設定を全ジョブで共有
default:
  before_script:
    - pip install uv --quiet
    - NEXUS_HOST_PORT=$(echo "${NEXUS_URL}" | sed 's|http://||')
    - export UV_DEFAULT_INDEX="http://${NEXUS_USER}:${NEXUS_PASS}@${NEXUS_HOST_PORT}/repository/python-group/simple/"

# ---------------------------------------------------------------------------
# Stage 1: build
#   uv sync で依存関係を取得し uv run で動作確認する
#   UV_INDEX_URL が uv.toml の [[index]] 設定を上書きするため
#   コンテナ内部の nexus:8081 経由でパッケージを取得する
# ---------------------------------------------------------------------------
build:
  stage: build
  image: python:3-slim
  script:
    - uv sync
    - uv run app.py
  cache:
    key: "${CI_PROJECT_ID}-uv"
    paths:
      - .cache/uv/

# ---------------------------------------------------------------------------
# Stage 2: publish
#   uv build で wheel / sdist を生成し Nexus python-hosted へアップロード
#   同一バージョンが既に存在する場合は失敗する（再実行時は version を更新すること）
# ---------------------------------------------------------------------------
publish:
  stage: publish
  image: python:3-slim
  script:
    - uv build
    - uv publish
        --publish-url "${NEXUS_URL}/repository/python-hosted/"
        --username "${NEXUS_USER}"
        --password "${NEXUS_PASS}"
  needs:
    - job: build
  cache:
    key: "${CI_PROJECT_ID}-uv"
    paths:
      - .cache/uv/
